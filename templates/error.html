<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oops!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #FFD700;
      font-family: 'Open Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .error-container {
      background-color: rgba(26, 26, 26, 0.95);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
    }
    a.btn {
      margin-top: 20px;
      background-color: #FFD700;
      color: #000;
      font-weight: 600;
    }
    a.btn:hover {
      background-color: #e6c200;
      color: #000;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1>😔 Oops!</h1>
    <p>Couldn’t complete your request. Please try again later.</p>
    <a href="{{ url_for('home') }}" class="btn btn-lg">Back to Home</a>
  </div>
</body>
</html>
