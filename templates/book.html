<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Book a Slot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/booking.css') }}">
</head>

<body>
  <div class="booking-page">
    <div class="booking-container">
      <h1>Book Your Slot Now</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
      {% endif %}
      {% endwith %}

      <form method="POST">
        <!-- Name input -->
        <input type="text" class="form-control mb-3" name="name" placeholder="Your Name" required>

        <!-- Phone input with fixed +91 -->
        <div class="input-group mb-3">
          <span class="input-group-text">+91</span>
          <input type="text" id="phone" name="phone" maxlength="10" pattern="\d{10}" required
            class="form-control" placeholder="Enter 10-digit number">
        </div>

        <!-- Date picker -->
        <input type="date" class="form-control mb-3" name="date" value="{{ selected_date }}" min="{{ min_date }}"
          onchange="this.form.submit()">

        <!-- Slot selection -->
        <div class="slot-container mb-3">
          {% for slot in slots %}
          <label>
            <input type="radio" name="time" value="{{ slot.time }}" {% if slot.booked %}disabled{% endif %}
              class="d-none">
            <span class="slot {% if slot.booked %}booked{% else %}available{% endif %}">{{ slot.time }}</span>
          </label>
          {% endfor %}
        </div>

        <!-- Submit button -->
        <button type="submit" class="btn btn-success btn-lg">Confirm Booking</button>
      </form>

      <a href="{{ url_for('home') }}" class="btn btn-secondary mt-3">⬅ Back to Home</a>
    </div>
  </div>

  <script>
    // Highlight selected slot
    const slots = document.querySelectorAll('.slot.available');
    slots.forEach(slot => {
      slot.addEventListener('click', () => {
        slots.forEach(s => s.classList.remove('selected'));
        slot.classList.add('selected');
      });
    });
  </script>
</body>

</html>
