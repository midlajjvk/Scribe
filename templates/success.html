<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking Confirmed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/success.css') }}">
</head>
<body>

  <div class="confirmation-container text-center mt-5">
    <h1>✅ Booking Confirmed!</h1>
    <p>Thank you <strong>{{ name }}</strong>.</p>
    <p>Your slot at <strong>{{ time }}</strong> on <strong>{{ date }}</strong> is booked successfully!</p>
    <p class="text-success">A confirmation SMS has been sent to your registered mobile number.</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">🏠 Go Back Home</a>
  </div>

</body>
</html>
